<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6600">
<title>Obra · Velderrain Arquitectos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<style>
  :root{--bg:#f6f5f3;--fg:#333332;--accent:#ff6600;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);padding:24px 16px}
  main{width:100%;max-width:420px;background:var(--card);border-radius:14px;padding:28px 22px;box-shadow:0 1px 3px rgb(0 0 0 / .08);text-align:center}
  img{width:100%;max-width:300px;height:auto}
  hr{border:0;height:3px;width:48px;background:var(--accent);margin:22px auto}
  p{margin:0;line-height:1.5}
</style>
</head>
<body>
<main>
  <img src="img/logo-horizontal.png" alt="Velderrain Arquitectos">
  <hr>
  <p>App de obra en construcción.</p>
</main>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
